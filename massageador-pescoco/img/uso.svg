<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1ece2"/>
      <stop offset="100%" stop-color="#e7e0d2"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecc7a1"/>
      <stop offset="100%" stop-color="#dcae82"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2c22"/>
      <stop offset="100%" stop-color="#241a14"/>
    </linearGradient>
    <linearGradient id="body2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c6e51"/>
      <stop offset="100%" stop-color="#3f4d37"/>
    </linearGradient>
  </defs>
  <rect width="700" height="700" fill="url(#bg2)"/>

  <!-- person from behind: shoulders + neck + head -->
  <path d="M150 700 C150 520 210 430 260 400 C240 360 230 300 230 250 C230 170 280 110 360 110 C430 110 470 170 470 250 C470 300 460 360 440 400 C500 430 560 520 560 700 Z" fill="url(#skin2)"/>
  <path d="M245 260 C245 150 300 90 365 90 C440 90 480 160 478 250 C478 210 450 175 400 168 C400 140 370 118 340 130 C300 145 260 190 245 260 Z" fill="url(#hair)"/>

  <!-- device on shoulders -->
  <g transform="translate(255,330)">
    <path d="M20 30 Q -20 90 30 150" stroke="#8a5a34" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M170 30 Q 210 90 160 150" stroke="#8a5a34" stroke-width="18" fill="none" stroke-linecap="round"/>
    <rect x="10" y="70" width="90" height="120" rx="45" fill="url(#body2)" transform="rotate(-14 55 130)"/>
    <rect x="90" y="70" width="90" height="120" rx="45" fill="url(#body2)" transform="rotate(14 135 130)"/>
    <circle cx="95" cy="70" r="20" fill="#eef0ea" stroke="#c9cdbf" stroke-width="3"/>
    <path d="M89 62v9m0 8a8 8 0 1 1-6-2" stroke="#6b7260" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <text x="350" y="650" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="24" font-weight="700" fill="#4a4335">Encaixa no pescoço e ombros</text>
</svg>
