<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf7f2"/>
      <stop offset="100%" stop-color="#f1ece2"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c6e51"/>
      <stop offset="100%" stop-color="#3f4d37"/>
    </linearGradient>
    <linearGradient id="finger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#647657"/>
      <stop offset="100%" stop-color="#465239"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="700" height="700" fill="url(#bg)"/>
  <ellipse cx="350" cy="560" rx="230" ry="34" fill="url(#shadow)"/>

  <!-- strap -->
  <path d="M180 260 Q 100 420 210 560" stroke="#8a5a34" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M520 260 Q 600 420 490 560" stroke="#8a5a34" stroke-width="26" fill="none" stroke-linecap="round"/>

  <!-- fingers (4 rounded capsules) -->
  <rect x="150" y="360" width="70" height="180" rx="35" fill="url(#finger)" transform="rotate(-18 185 450)"/>
  <rect x="225" y="400" width="60" height="170" rx="30" fill="url(#finger)" transform="rotate(-8 255 485)"/>
  <rect x="415" y="400" width="60" height="170" rx="30" fill="url(#finger)" transform="rotate(8 445 485)"/>
  <rect x="480" y="360" width="70" height="180" rx="35" fill="url(#finger)" transform="rotate(18 515 450)"/>

  <!-- main body -->
  <rect x="180" y="150" width="340" height="360" rx="120" fill="url(#body)"/>
  <rect x="180" y="150" width="340" height="360" rx="120" fill="#fff" opacity=".04"/>

  <!-- fabric texture lines -->
  <g stroke="#fff" stroke-opacity=".07" stroke-width="3">
    <line x1="210" y1="190" x2="270" y2="130"/>
    <line x1="250" y1="220" x2="320" y2="150"/>
    <line x1="290" y1="250" x2="370" y2="170"/>
    <line x1="330" y1="280" x2="420" y2="190"/>
    <line x1="370" y1="310" x2="470" y2="210"/>
    <line x1="410" y1="340" x2="500" y2="250"/>
  </g>

  <!-- control panel -->
  <rect x="270" y="200" width="160" height="70" rx="35" fill="#eef0ea" stroke="#c9cdbf" stroke-width="3"/>
  <circle cx="310" cy="235" r="16" fill="#fff" stroke="#9aa08c" stroke-width="3"/>
  <path d="M310 226v9m0 9a10 10 0 1 1-7-3" stroke="#6b7260" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <rect x="342" y="228" width="6" height="16" rx="3" fill="#c9cdbf"/>
  <circle cx="390" cy="235" r="16" fill="#fff" stroke="#9aa08c" stroke-width="3"/>
  <path d="M382 240c0-8 6-8 6-14 0 6 6 6 6 14a6 6 0 1 1-12 0Z" fill="#e08a4a"/>

  <text x="350" y="640" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="24" font-weight="700" fill="#3f4d37">Massageador 8 Pontos</text>
</svg>
