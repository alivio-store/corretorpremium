<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700">
  <defs>
    <linearGradient id="bgdark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1524"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9a3d" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ff6a1f" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ff6a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8bd97"/>
      <stop offset="100%" stop-color="#d6a377"/>
    </linearGradient>
    <linearGradient id="finger2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#647657"/>
      <stop offset="100%" stop-color="#3f4d37"/>
    </linearGradient>
  </defs>
  <rect width="700" height="700" fill="url(#bgdark)"/>

  <!-- neck + shoulders silhouette -->
  <path d="M230 700 C230 560 260 470 300 430 C280 400 270 360 270 320 L430 320 C430 360 420 400 400 430 C440 470 470 560 470 700 Z" fill="url(#skin)"/>

  <!-- left hand of fingers -->
  <g transform="translate(150,300)">
    <rect x="0" y="30" width="52" height="120" rx="26" fill="url(#finger2)" transform="rotate(-10 26 90)"/>
    <rect x="46" y="10" width="52" height="130" rx="26" fill="url(#finger2)" transform="rotate(-3 72 75)"/>
    <rect x="94" y="20" width="52" height="120" rx="26" fill="url(#finger2)" transform="rotate(6 120 80)"/>
    <ellipse cx="90" cy="95" rx="46" ry="52" fill="url(#glow)"/>
  </g>

  <!-- right hand of fingers -->
  <g transform="translate(360,300)">
    <rect x="0" y="20" width="52" height="120" rx="26" fill="url(#finger2)" transform="rotate(-6 26 80)"/>
    <rect x="48" y="10" width="52" height="130" rx="26" fill="url(#finger2)" transform="rotate(3 74 75)"/>
    <rect x="96" y="30" width="52" height="120" rx="26" fill="url(#finger2)" transform="rotate(10 122 90)"/>
    <ellipse cx="90" cy="95" rx="46" ry="52" fill="url(#glow)"/>
  </g>

  <!-- temperature pills -->
  <g font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-weight="800">
    <rect x="150" y="560" width="150" height="46" rx="23" fill="#12202f" stroke="#2c3d4d" stroke-width="2"/>
    <text x="225" y="590" text-anchor="middle" font-size="15" fill="#ff8a3d">MODO BAIXO&#8202;&#8202;<tspan fill="#fff">42°C</tspan></text>
    <rect x="400" y="560" width="150" height="46" rx="23" fill="#12202f" stroke="#2c3d4d" stroke-width="2"/>
    <text x="475" y="590" text-anchor="middle" font-size="15" fill="#ff8a3d">MODO ALTO&#8202;&#8202;<tspan fill="#fff">45°C</tspan></text>
  </g>
</svg>
