<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Velvet — Your Program</title>
<meta name="description" content="Your personal 28-day Velvet program.">
<meta name="theme-color" content="#160f18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root{
    --ink:#241a24;
    --bg-dark:#160f18;
    --bg-dark-2:#1f1521;
    --paper:#fbf6f4;
    --card:#ffffff;
    --rose:#c14468;
    --rose-dark:#9c3252;
    --gold:#cf9d51;
    --gold-dark:#a97c37;
    --muted:#7a6d76;
    --border:#ece2e3;
    --ok:#3f8f6c;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--paper);line-height:1.5;-webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:inherit;}
  button{font-family:inherit;}
  .app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;}

  /* TOPBAR */
  .topbar{
    position:sticky;top:0;z-index:20;background:var(--bg-dark);color:#fff;
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;
  }
  .topbar .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem;}
  .topbar .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--rose);}
  .topbar button.icon-btn{background:none;border:none;color:rgba(255,255,255,.75);font-size:1.2rem;cursor:pointer;}

  main{padding:20px 18px 100px;}
  .hide{display:none !important;}

  /* GATE SCREEN */
  .gate{min-height:80vh;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px;}
  .gate h1{font-size:1.4rem;margin:0;}
  .gate p{color:var(--muted);font-size:.92rem;margin:0 0 8px;}
  .gate input{
    width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--border);
    font-size:1rem;text-align:center;letter-spacing:.08em;
  }
  .gate .err{color:var(--rose-dark);font-size:.85rem;min-height:1.2em;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:15px 24px;border-radius:12px;font-weight:700;font-size:.98rem;
    cursor:pointer;border:none;width:100%;
    background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#241505;
  }
  .btn-outline{background:none;border:1.5px solid var(--border);color:var(--ink);}

  /* PROGRESS RING */
  .progress-card{
    background:linear-gradient(135deg,#2a1a2d,#160f18);color:#fff;border-radius:18px;
    padding:22px;display:flex;align-items:center;gap:16px;margin-bottom:22px;
  }
  .ring{position:relative;width:64px;height:64px;flex:none;}
  .ring svg{transform:rotate(-90deg);}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;}
  .progress-card h2{margin:0;font-size:1rem;}
  .progress-card p{margin:2px 0 0;font-size:.8rem;color:rgba(255,255,255,.6);}

  /* WEEK GROUPS */
  .week-block{margin-bottom:26px;}
  .week-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;}
  .week-head .n{font-size:.78rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--rose-dark);}
  .week-head .t{font-size:.95rem;color:var(--muted);}
  .day-row{
    display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;
  }
  .day-row:active{border-color:var(--rose);}
  .day-row .num{
    flex:none;width:34px;height:34px;border-radius:50%;background:#f3ecec;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:var(--rose-dark);
  }
  .day-row.done .num{background:var(--ok);color:#fff;}
  .day-row .info{flex:1;min-width:0;}
  .day-row .info .t{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .day-row .info .sub{font-size:.78rem;color:var(--muted);}
  .day-row .chev{color:var(--muted);font-size:1.1rem;}

  /* LESSON VIEW */
  .lesson-head{margin-bottom:18px;}
  .lesson-head .eyebrow{font-size:.75rem;font-weight:700;color:var(--rose-dark);text-transform:uppercase;letter-spacing:.05em;}
  .lesson-head h1{font-size:1.35rem;margin:.3em 0;}
  .lesson-body{font-size:.98rem;color:#3c333c;margin-bottom:18px;}
  .kp-list{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:18px;}
  .kp-list h3{font-size:.85rem;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .kp-list li{display:flex;gap:8px;padding:6px 0;font-size:.92rem;}
  .practice-card{background:linear-gradient(135deg,#2a1a2d,#160f18);color:#fff;border-radius:16px;padding:20px;margin-bottom:22px;}
  .practice-card h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--gold);margin:0 0 4px;}
  .practice-card .pt{font-size:1.05rem;font-weight:700;margin:0 0 4px;}
  .practice-card .dur{font-size:.8rem;color:rgba(255,255,255,.55);margin-bottom:12px;}
  .practice-card ol{margin:0;padding-left:20px;}
  .practice-card li{font-size:.9rem;padding:4px 0;color:rgba(255,255,255,.88);}

  .nav-btns{display:flex;gap:10px;margin-top:8px;}
  .nav-btns .btn{flex:1;}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.88rem;margin-bottom:14px;background:none;border:none;cursor:pointer;padding:0;}

  /* BOTTOM NAV */
  .bottom-nav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
    display:flex;background:#fff;border-top:1px solid var(--border);
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));z-index:20;
  }
  .bottom-nav button{
    flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    color:var(--muted);font-size:.7rem;cursor:pointer;padding:4px;
  }
  .bottom-nav button.active{color:var(--rose-dark);}
  .bottom-nav .ic{font-size:1.15rem;}

  .settings-item{
    display:flex;justify-content:space-between;align-items:center;background:var(--card);
    border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:.92rem;
  }
</style>
</head>
<body>

<div class="app">

  <!-- ACCESS GATE -->
  <div id="gate" class="gate hide" style="padding:0 4px;">
    <h1>Welcome to Velvet</h1>
    <p>Enter the access code from your purchase confirmation to unlock your program.</p>
    <input id="gate-input" inputmode="text" autocapitalize="characters" placeholder="ACCESS CODE" maxlength="24">
    <div id="gate-err" class="err"></div>
    <button id="gate-submit" class="btn">Unlock My Program</button>
    <p style="font-size:.76rem;color:var(--muted);">Lost your code? Check your Hotmart purchase email, or contact support.</p>
  </div>

  <div id="shell" class="hide">
    <div class="topbar">
      <div class="logo"><span class="dot"></span> Velvet</div>
      <button class="icon-btn" id="lock-btn" title="Lock app">🔒</button>
    </div>

    <main id="main"></main>

    <nav class="bottom-nav">
      <button data-tab="home" class="active"><span class="ic">🏠</span>Program</button>
      <button data-tab="settings"><span class="ic">⚙️</span>Settings</button>
    </nav>
  </div>
</div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
